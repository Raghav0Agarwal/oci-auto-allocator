name: OCI Instance Allocation Loop

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-and-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI & Generate Clean SSH Key
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          # Generate a single-line OpenSSH public key directly from your validated private key
          ssh-keygen -y -f ~/.oci/oci_api_key.pem > ~/.oci/ssh-key.pub
          chmod 644 ~/.oci/ssh-key.pub

          # Sanitize OCI config credentials
          USER_CLEAN=$(echo "$OCI_USER_OCID" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          TENANCY_CLEAN=$(echo "$OCI_TENANCY_OCID" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          FP_CLEAN=$(echo "$OCI_FINGERPRINT" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^fingerprint=//I')
          REGION_CLEAN=$(echo "$OCI_REGION" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${USER_CLEAN}
          fingerprint=${FP_CLEAN}
          tenancy=${TENANCY_CLEAN}
          region=${REGION_CLEAN:-ap-mumbai-1}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Attempt Provisioning
        env:
          AD: ${{ secrets.AVAILABILITY_DOMAIN }}
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          SUBNET: ${{ secrets.SUBNET_ID }}
          IMAGE: ${{ secrets.IMAGE_ID }}
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          set +e

          SHAPE_CONFIG='{"ocpus":2,"memoryInGBs":12}'
          INSTANCE_NAME="Kage"

          echo "=================================================="
          echo " Starting allocation loop for instance: $INSTANCE_NAME"
          echo " Shape: 2 OCPU / 12 GB RAM | Region: ap-mumbai-1"
          echo "=================================================="

          for attempt in 1 2 3; do
            CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S')
            echo -n "[Attempt $attempt - $CURRENT_TIME] Requesting '$INSTANCE_NAME'... "

            OUTPUT=$(oci compute instance launch \
              --no-retry \
              --availability-domain "$AD" \
              --compartment-id "$TENANCY" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config "$SHAPE_CONFIG" \
              --image-id "$IMAGE" \
              --subnet-id "$SUBNET" \
              --assign-public-ip true \
              --ssh-authorized-keys-file "/home/runner/.oci/ssh-key.pub" \
              --display-name "$INSTANCE_NAME" 2>&1)
            STATUS=$?

            if [ $STATUS -eq 0 ]; then
              echo ""
              echo "=================================================="
              echo " SUCCESS! Instance '$INSTANCE_NAME' provisioned!"
              echo "=================================================="
              echo "$OUTPUT"

              # Send Telegram alert ONLY on success
              if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
                MSG="🎉 SUCCESS! Instance '${INSTANCE_NAME}' (2 OCPU / 12 GB RAM) has been provisioned in Mumbai! Check your Oracle Cloud Console."
                curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${TG_CHAT_ID}" \
                  --data-urlencode "text=${MSG}" > /dev/null || true
              fi

              exit 0
            fi

            if echo "$OUTPUT" | grep -qi "Too many requests"; then
              echo "Rate limited (429). Waiting 90s..."
            elif echo "$OUTPUT" | grep -qi "capacity"; then
              echo "Host capacity full in Mumbai. Waiting 90s..."
            else
              ERR=$(echo "$OUTPUT" | grep -o '"message": "[^"]*' | head -n 1 | cut -d'"' -f4)
              echo "API Error: ${ERR:-$OUTPUT}"
            fi

            if [ $attempt -lt 3 ]; then
              sleep 90
            fi
          done

          exit 0
