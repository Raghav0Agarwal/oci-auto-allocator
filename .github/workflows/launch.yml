name: OCI Instance Allocation Loop

on:
  schedule:
    # Safety net: starts a run every 6 hours if a chain ever gets dropped
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum limit is 6 hours
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI & Generate Clean SSH Key
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          # Generate clean OpenSSH public key directly from private key
          ssh-keygen -y -f ~/.oci/oci_api_key.pem > ~/.oci/ssh-key.pub
          chmod 644 ~/.oci/ssh-key.pub

          # Sanitize OCI config credentials
          USER_CLEAN=$(echo "$OCI_USER_OCID" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          TENANCY_CLEAN=$(echo "$OCI_TENANCY_OCID" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          FP_CLEAN=$(echo "$OCI_FINGERPRINT" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^fingerprint=//I')
          REGION_CLEAN=$(echo "$OCI_REGION" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${USER_CLEAN}
          fingerprint=${FP_CLEAN}
          tenancy=${TENANCY_CLEAN}
          region=${REGION_CLEAN:-ap-mumbai-1}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Continuous Allocation Loop
        env:
          AD: ${{ secrets.AVAILABILITY_DOMAIN }}
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          SUBNET: ${{ secrets.SUBNET_ID }}
          IMAGE: ${{ secrets.IMAGE_ID }}
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          set +e

          SHAPE_CONFIG='{"ocpus":2,"memoryInGBs":12}'
          INSTANCE_NAME="Kage"

          send_tg() {
            local msg="$1"
            if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT_ID}" \
                --data-urlencode "text=${msg}" > /dev/null || true
            fi
          }

          send_tg "🚀 Starting 6-hour continuous allocation loop for '$INSTANCE_NAME' in ap-mumbai-1 (30s interval)..."

          START_TIME=$(date +%s)
          MAX_RUNTIME=20700 # 5 hours 45 minutes
          ATTEMPT=0

          while true; do
            CURRENT_TIMESTAMP=$(date +%s)
            ELAPSED=$((CURRENT_TIMESTAMP - START_TIME))

            # When 5h45m is reached, wait 30s, trigger next session immediately, and exit
            if [ $ELAPSED -ge $MAX_RUNTIME ]; then
              send_tg "🔄 Completed 5h45m loop ($ATTEMPT checks). Resting 30s and starting next session..."
              sleep 30
              gh workflow run launch.yml --repo "$REPO" || true
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            NOW=$(date '+%H:%M:%S')
            echo -n "[$NOW - Attempt $ATTEMPT] Requesting '$INSTANCE_NAME'... "

            OUTPUT=$(oci compute instance launch \
              --no-retry \
              --availability-domain "$AD" \
              --compartment-id "$TENANCY" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config "$SHAPE_CONFIG" \
              --image-id "$IMAGE" \
              --subnet-id "$SUBNET" \
              --assign-public-ip true \
              --ssh-authorized-keys-file "/home/runner/.oci/ssh-key.pub" \
              --display-name "$INSTANCE_NAME" 2>&1)
            STATUS=$?

            if [ $STATUS -eq 0 ]; then
              echo "SUCCESS! Instance created!"
              send_tg "🎉 SUCCESS! Instance '${INSTANCE_NAME}' (2 OCPU / 12 GB RAM) has been provisioned in Mumbai! Disabling workflow automatically."

              # Automatically disable this workflow so no more runs execute
              gh workflow disable launch.yml --repo "$REPO" || true
              exit 0
            fi

            if echo "$OUTPUT" | grep -qi "Too many requests"; then
              echo "Rate limited (429). Waiting 90s cooldown..."
              send_tg "⚠️ [$NOW] Attempt $ATTEMPT: Rate limited (429). Backing off 90s..."
              sleep 90
              continue
            elif echo "$OUTPUT" | grep -qi "capacity"; then
              echo "Host capacity full in Mumbai. Waiting 60s..."
            else
              ERR=$(echo "$OUTPUT" | grep -o '"message": "[^"]*' | head -n 1 | cut -d'"' -f4)
              echo "API Error: ${ERR:-$OUTPUT}"
            fi

            # Status ping sent to Telegram every 60 attempts (~30 minutes)
            if [ $((ATTEMPT % 60)) -eq 0 ]; then
              send_tg "⏳ Status Check: $ATTEMPT attempts completed. Still polling capacity in Mumbai..."
            fi

            sleep 60
          done
